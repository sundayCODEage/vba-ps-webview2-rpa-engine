<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340">
  <defs>
    <!-- 外枠の明るいスレートグラデーション -->
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- ウィンドウのドロップシャドウ -->
    <filter id="shadowB" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 全体背景 -->
  <rect width="820" height="340" rx="12" fill="url(#bgGradB)" stroke="#64748b" stroke-width="1" />

  <!-- ================= 左側：WebView2 ブラウザ画面 ================= -->
  <rect x="22" y="18" width="340" height="304" rx="8" fill="#0b1120" stroke="#475569" stroke-width="1.5" filter="url(#shadowB)" />
  <!-- タイトルバー -->
  <path d="M 22 26 A 8 8 0 0 1 30 18 L 354 18 A 8 8 0 0 1 362 26 L 362 48 L 22 48 Z" fill="#1e293b" />
  <circle cx="40" cy="33" r="5" fill="#ef4444" />
  <circle cx="56" cy="33" r="5" fill="#f59e0b" />
  <circle cx="72" cy="33" r="5" fill="#22c55e" />
  <text x="92" y="37" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">RPA Browser (WebView2 / DPR: 1.25)</text>

  <!-- 通常DOM要素 (ブルーのヘッダーでコントラストを付与) -->
  <rect x="42" y="64" width="300" height="34" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
  <text x="56" y="85" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">固定ヘッダー (#fixed-header)</text>

  <!-- Shadow DOM 領域 (ディープバイオレット＋明るいシアン・パープル枠) -->
  <rect x="42" y="114" width="300" height="190" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="5,4" />
  <text x="54" y="136" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">#shadow-root (open) - 貫通探索エリア</text>
  
  <text x="58" y="164" fill="#f1f5f9" font-family="sans-serif" font-size="12">ドロップダウン (Select)</text>
  <rect x="58" y="174" width="268" height="36" rx="4" fill="#090d16" stroke="#64748b" stroke-width="1.5" />
  <text x="70" y="196" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">[select id="shadow-select"] ▼</text>

  <rect x="58" y="236" width="165" height="36" rx="18" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
  <text x="74" y="259" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">選択肢 A (span.label)</text>

  <!-- 動く赤枠ハイライト -->
  <rect x="42" y="64" width="300" height="34" rx="4" fill="#ef4444" fill-opacity="0.25" stroke="#ff5555" stroke-width="2.8">
    <animate attributeName="x" values="42;42;58;58;58;42" keyTimes="0;0.15;0.3;0.75;0.85;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y" values="64;64;174;174;236;64" keyTimes="0;0.15;0.3;0.75;0.85;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="width" values="300;300;268;268;165;300" keyTimes="0;0.15;0.3;0.75;0.85;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="height" values="34;34;36;36;36;34" keyTimes="0;0.15;0.3;0.75;0.85;1" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- ピッカー発火波紋 (パルス) -->
  <circle cx="190" cy="192" r="2" fill="none" stroke="#facc15" stroke-width="3" opacity="0">
    <animate attributeName="r" values="2;2;36;36" keyTimes="0;0.32;0.5;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.32;0.5;1" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- マウスカーソル -->
  <g>
    <polygon points="0,0 0,18 5,14 9,22 12,20 8,12 14,12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <animateTransform attributeName="transform" type="translate" values="90,82; 90,82; 190,192; 190,192; 120,255; 90,82" keyTimes="0;0.15;0.3;0.75;0.85;1" dur="6s" repeatCount="indefinite" />
  </g>

  <!-- ================= 中央：パイプライン通信アニメーション ================= -->
  <line x1="366" y1="170" x2="438" y2="170" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4" />
  <circle cx="366" cy="170" r="5.5" fill="#facc15">
    <animate attributeName="cx" values="366;438" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="371" y="156" fill="#e2e8f0" font-family="monospace" font-size="10.5" font-weight="bold">JSON / CDP</text>

  <!-- ================= 右側：PowerShell エンジン ＆ VBA ピッカー解析結果 ================= -->
  <rect x="442" y="18" width="356" height="304" rx="8" fill="#0b1120" stroke="#475569" stroke-width="1.5" filter="url(#shadowB)" />
  <path d="M 442 26 A 8 8 0 0 1 450 18 L 790 18 A 8 8 0 0 1 798 26 L 798 48 L 442 48 Z" fill="#1e293b" />
  <text x="458" y="37" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Ps_Engine_Core v303 + Excel VBA Picker</text>

  <!-- Step 1: 座標逆引き -->
  <g opacity="0.22">
    <rect x="458" y="58" width="324" height="74" rx="6" fill="#172554" stroke="#38bdf8" stroke-width="1.5" />
    <text x="470" y="78" fill="#7dd3fc" font-family="monospace" font-size="11.5" font-weight="bold">[Step 1] PointReverse (OS座標 → DOM逆引き)</text>
    <text x="470" y="98" fill="#f1f5f9" font-family="sans-serif" font-size="12">Screen(950,409) ÷ DPR(1.25) + ScrollY</text>
    <text x="470" y="117" fill="#fde047" font-family="monospace" font-size="11.5" font-weight="bold">Hit Target : SELECT (#shadow-select)</text>
    <animate attributeName="opacity" values="0.22;0.22;1;1;0.22" keyTimes="0;0.32;0.38;0.9;1" dur="6s" repeatCount="indefinite" />
  </g>

  <!-- Step 2: コマンド自動生成 -->
  <g opacity="0.22">
    <rect x="458" y="142" width="324" height="84" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="470" y="162" fill="#a5b4fc" font-family="monospace" font-size="11.5" font-weight="bold">[Step 2] getRootNode() + DOMUtils セレクタ生成</text>
    <text x="470" y="182" fill="#38bdf8" font-family="monospace" font-size="11.5">Selector : "#shadow-select"</text>
    <text x="470" y="200" fill="#f472b6" font-family="monospace" font-size="11.5">Command  : Invoke-WebClick</text>
    <text x="470" y="217" fill="#e2e8f0" font-family="sans-serif" font-size="11.5">BBox     : {"x":387, "y":1385, "w":747, "h":39}</text>
    <animate attributeName="opacity" values="0.22;0.22;1;1;0.22" keyTimes="0;0.45;0.52;0.9;1" dur="6s" repeatCount="indefinite" />
  </g>

  <!-- Step 3: 安定性テスト -->
  <g opacity="0.22">
    <rect x="458" y="236" width="324" height="72" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.8" />
    <text x="470" y="256" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">✔ [Step 3] Test-SelectorStability (3/3 OK)</text>
    <text x="470" y="276" fill="#f1f5f9" font-family="sans-serif" font-size="12">deepQuerySelector 貫通検証完了 (Flaky防止)</text>
    <text x="470" y="295" fill="#fde047" font-family="monospace" font-size="12" font-weight="bold">Result : Excel シートへ RPAコードを自動転記</text>
    <animate attributeName="opacity" values="0.22;0.22;1;1;0.22" keyTimes="0;0.58;0.65;0.9;1" dur="6s" repeatCount="indefinite" />
  </g>
</svg>